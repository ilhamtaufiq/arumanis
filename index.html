  <!-- Early build freshness check — runs before the main bundle. -->
  <script>
    (function () {
      var storageKey = 'arumanis-app-build-id';
      var pendingKey = 'arumanis-reload-pending';
      var attemptKey = 'arumanis-reload-attempt';
      var lockKey = 'arumanis-reload-lock';
      var maxAttempts = 3;
      var reloadStarted = false;

      function showBootOverlay() {
        var overlay = document.getElementById('boot-update-overlay');
        if (overlay) overlay.style.display = 'flex';
      }

      function hardReload() {
        var url = new URL(window.location.href);
        url.searchParams.set('_cb', Date.now().toString(36));
        url.searchParams.delete('_reload');
        window.location.replace(url.toString());
      }

      async function clearClientCaches() {
        if ('caches' in window) {
          try {
            var names = await caches.keys();
            await Promise.all(names.map(function (name) { return caches.delete(name); }));
          } catch (e) { /* ignore */ }
        }
        if ('serviceWorker' in navigator) {
          try {
            var regs = await navigator.serviceWorker.getRegistrations();
            await Promise.all(regs.map(function (reg) { return reg.unregister(); }));
          } catch (e) { /* ignore */ }
        }
      }

      async function runStaleBuildReload() {
        if (reloadStarted) return;
        reloadStarted = true;

        var attempts = Number(sessionStorage.getItem(attemptKey) || '0') + 1;
        if (attempts > maxAttempts) {
          sessionStorage.removeItem(pendingKey);
          reloadStarted = false;
          return;
        }

        sessionStorage.setItem(attemptKey, String(attempts));
        sessionStorage.setItem(pendingKey, '1');
        sessionStorage.setItem(lockKey, String(Date.now()));
        showBootOverlay();
        await clearClientCaches();
        hardReload();
      }

      function isAssetFailureTarget(target) {
        if (!target || !target.tagName) return false;
        var tag = target.tagName;
        if (tag === 'SCRIPT') return true;
        return tag === 'LINK' && target.rel === 'stylesheet';
      }

      function isAssetFailureMessage(message) {
        if (!message) return false;
        var normalized = String(message).toLowerCase();
        return normalized.indexOf('mime type') !== -1
          || normalized.indexOf('module script') !== -1
          || normalized.indexOf('importing a module script') !== -1
          || normalized.indexOf('dynamically imported module') !== -1
          || normalized.indexOf('loading chunk') !== -1
          || normalized.indexOf('failed to fetch dynamically imported module') !== -1;
      }

      var bootStartedAt = Date.now();
      var BOOT_GRACE_MS = 4000;

      function shouldHandleAssetFailure() {
        return Date.now() - bootStartedAt > BOOT_GRACE_MS;
      }

      function verifyMissingAsset(target) {
        if (!shouldHandleAssetFailure()) return;

        var src = target && (target.src || target.href);
        if (!src) {
          runStaleBuildReload();
          return;
        }

        fetch(src, { method: 'HEAD', cache: 'no-store' })
          .then(function (response) {
            if (response.status === 404) {
              runStaleBuildReload();
            }
          })
          .catch(function () { /* ignore transient network errors */ });
      }

      window.addEventListener('error', function (event) {
        try {
          if (isAssetFailureTarget(event.target)) {
            verifyMissingAsset(event.target);
            return;
          }

          if (shouldHandleAssetFailure() && isAssetFailureMessage(event.message)) {
            runStaleBuildReload();
          }
        } catch (e) { /* ignore */ }
      }, true);

      function checkRemoteBuildVersion(servedId) {
        fetch('/version.json?_=' + Date.now() + '&v=' + encodeURIComponent(servedId), {
          cache: 'no-store',
          headers: { 'Cache-Control': 'no-cache' },
        })
          .then(function (response) {
            if (!response.ok) return null;
            return response.json();
          })
          .then(function (data) {
            if (!data || !data.buildId || data.buildId === 'dev') return;
            if (data.buildId !== servedId) {
              runStaleBuildReload();
            }
          })
          .catch(function () { /* ignore */ });
      }

      try {
        if (sessionStorage.getItem(pendingKey) === '1') {
          showBootOverlay();
        }

        var servedMeta = document.querySelector('meta[name="app-build-id"]');
        var servedId = servedMeta && servedMeta.content;

        // Sync storage only — index.html already references the correct hashed /assets/* files.
        if (servedId && servedId !== 'dev') {
          localStorage.setItem(storageKey, servedId);
        }

        if (servedId && servedId !== 'dev') {
          window.addEventListener('load', function () {
            window.setTimeout(function () {
              checkRemoteBuildVersion(servedId);
            }, BOOT_GRACE_MS);
          });
        }
      } catch (e) { /* ignore */ }
    })();
  </script>
